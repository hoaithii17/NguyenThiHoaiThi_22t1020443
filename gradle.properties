# ---------- Configuration Cache ----------
# Reuses the task graph from a previous build, skipping the entire configuration phase.
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true

# (Optional) Maximum number of configuration-cache problems that are tolerated
# before the build fails. Set to 0 for strict mode once migration is complete.
org.gradle.configuration-cache.max-problems=0

# ---------- Parallel & Caching ----------
org.gradle.parallel=true
org.gradle.caching=true

# ---------- JVM Args for Gradle Daemon (Java 21) ----------
org.gradle.jvmargs=-Xmx2g

